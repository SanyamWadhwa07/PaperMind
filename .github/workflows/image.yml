name: API image

# Builds backend/Dockerfile and publishes it to GitHub's container registry,
# where Azure Container Apps pulls it from. Public images on ghcr.io are free,
# so the deploy needs no registry account and no registry credentials.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "core/**"
      - "requirements.txt"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/sanyamwadhwa07/papermind-api:latest
            ghcr.io/sanyamwadhwa07/papermind-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/SanyamWadhwa07/PaperMind
          cache-from: type=gha
          cache-to: type=gha,mode=max
