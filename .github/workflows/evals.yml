name: Evals

# The test suite proves the code runs. This proves the *output* has not got
# worse. Prompts live in `core/graph/summary_graph.py` strings and in the field
# descriptions of `core/graph/schemas.py` — whose own docstring says those
# descriptions "materially affect extraction quality" — so without this job a PR
# can rewrite the prompt and CI stays green.
#
# Runs without an LLM API key on purpose: grounding and section detection need
# only the labelled claims and a local embedding model, so the gate works on
# every PR including forks. Metrics needing pipeline output are reported as SKIP
# rather than silently passing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate the golden set
        run: python evals/label.py check --strict -v

      - name: Gate on golden-set metrics
        run: python evals/golden_eval.py gate

      - name: Upload metric report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-report
          path: evals/results/golden_*.json
