# Render Blueprint for the PaperMind API.
#
# The frontend is on Vercel (frontend/vercel.json) and the database is
# Supabase, so this is the only service. Values marked `sync: false` are typed
# into the Render dashboard when the Blueprint is first applied; secrets never
# live in this file.
services:
  - type: web
    name: papermind-api
    runtime: docker
    # 1 CPU / 2 GB. The API holds ~0.4 GB of anonymous memory after import and
    # ~1.2 GB with every figure model loaded, which rules out the 512 MB plans.
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    branch: main
    # Deploy a commit only once its GitHub checks (tests, evals) pass.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - core/**
        - requirements.txt
        - render.yaml
    envVars:
      # backend/Dockerfile's uvicorn binds 8000; Render's default is 10000.
      - key: PORT
        value: "8000"
      # Each worker loads its own copy of the models.
      - key: WEB_CONCURRENCY
        value: "1"
      # No Ollama on Render: the chain is Gemini → Groq.
      - key: PAPERMIND_OLLAMA_ENABLED
        value: "0"
      - key: PAPERMIND_LLM_BACKEND
        value: auto
      - key: LOG_JSON
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      # The Vercel origin, e.g. https://papermind.vercel.app — no trailing slash.
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
