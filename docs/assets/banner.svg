<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="PaperMind — research papers to structured intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1414"/>
      <stop offset="1" stop-color="#0a1f1d"/>
    </linearGradient>
    <linearGradient id="tealCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2B8"/>
      <stop offset="0.55" stop-color="#00988F"/>
      <stop offset="1" stop-color="#D9A86C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00988F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00988F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="22" fill="none" stroke="#00988F" stroke-opacity="0.25" stroke-width="1.5"/>
  <ellipse cx="760" cy="150" rx="320" ry="220" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="64" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="url(#tealCopper)">PaperMind</text>
  <text x="66" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#cfe8e5">Research papers&#160;&#8594;&#160;structured intelligence</text>

  <!-- tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="64" y="196" width="118" height="30" rx="15" fill="#00988F" fill-opacity="0.16" stroke="#00988F" stroke-opacity="0.5"/>
      <text x="123" y="216" fill="#7fded6" text-anchor="middle">LangGraph</text>
    </g>
    <g>
      <rect x="192" y="196" width="196" height="30" rx="15" fill="#00988F" fill-opacity="0.16" stroke="#00988F" stroke-opacity="0.5"/>
      <text x="290" y="216" fill="#7fded6" text-anchor="middle">Gemini · Groq · Ollama</text>
    </g>
    <g>
      <rect x="398" y="196" width="92" height="30" rx="15" fill="#D9A86C" fill-opacity="0.16" stroke="#D9A86C" stroke-opacity="0.5"/>
      <text x="444" y="216" fill="#e7c597" text-anchor="middle">FastAPI</text>
    </g>
    <g>
      <rect x="500" y="196" width="80" height="30" rx="15" fill="#D9A86C" fill-opacity="0.16" stroke="#D9A86C" stroke-opacity="0.5"/>
      <text x="540" y="216" fill="#e7c597" text-anchor="middle">React</text>
    </g>
  </g>

  <!-- knowledge-graph motif (right) -->
  <g stroke="#00988F" stroke-opacity="0.55" stroke-width="2">
    <line x1="720" y1="92" x2="828" y2="70"/>
    <line x1="720" y1="92" x2="800" y2="160"/>
    <line x1="800" y1="160" x2="900" y2="120"/>
    <line x1="828" y1="70" x2="900" y2="120"/>
    <line x1="800" y1="160" x2="868" y2="210"/>
    <line x1="720" y1="92" x2="690" y2="170"/>
    <line x1="690" y1="170" x2="800" y2="160"/>
  </g>
  <!-- paper node (central) -->
  <g>
    <rect x="700" y="68" width="40" height="50" rx="5" fill="#0c1414" stroke="#00C2B8" stroke-width="2.5"/>
    <line x1="708" y1="80" x2="732" y2="80" stroke="#00C2B8" stroke-width="2"/>
    <line x1="708" y1="90" x2="732" y2="90" stroke="#00C2B8" stroke-width="2"/>
    <line x1="708" y1="100" x2="724" y2="100" stroke="#00C2B8" stroke-width="2"/>
  </g>
  <g fill="#0c1414">
    <circle cx="828" cy="70" r="13" stroke="#D9A86C" stroke-width="2.5"/>
    <circle cx="900" cy="120" r="11" stroke="#00C2B8" stroke-width="2.5"/>
    <circle cx="800" cy="160" r="14" stroke="#00988F" stroke-width="2.5"/>
    <circle cx="868" cy="210" r="10" stroke="#D9A86C" stroke-width="2.5"/>
    <circle cx="690" cy="170" r="10" stroke="#00C2B8" stroke-width="2.5"/>
  </g>
  <g fill="#00C2B8">
    <circle cx="828" cy="70" r="4"/>
    <circle cx="900" cy="120" r="3.5"/>
    <circle cx="800" cy="160" r="4.5"/>
    <circle cx="868" cy="210" r="3"/>
    <circle cx="690" cy="170" r="3"/>
  </g>
</svg>
